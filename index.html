<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f2226">
<title>Cierre de Mes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
  // El link del correo "Recuperar contraseña" trae #...type=recovery (o un error si venció).
  // Se anota aquí, antes de que el cliente de Supabase lea y limpie la URL.
  window.__recuperacion = /type=recovery/.test(location.hash);
  window.__errorEnlace = (/error_description=([^&]+)/.exec(location.hash) || [])[1] || null;
  (function(){
    try {
      var m = localStorage.getItem('cierre_mes_modo');
      // Sin elección guardada, el tema por defecto es "Limpio".
      document.documentElement.setAttribute('data-modo', (m === 'dark' || m === 'light' || m === 'clean') ? m : 'clean');
    } catch(e){}
  })();
</script>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<section id="vista-login" class="pantalla activa">
  <div class="login-caja">
    <div class="marca">
      <img src="icon-192.png" alt="" width="44" height="44">
      <div>
        <h1>Cierre de Mes</h1>
        <p>Lecturas de energía, agua y gas</p>
      </div>
      <button class="icono btn-alternar-tema" id="btn-tema-login" type="button" title="Elegir tema de colores" aria-label="Elegir tema" style="margin-left:auto">
        <svg class="icono-paleta" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path></svg>
      </button>
    </div>
    <form id="form-login">
      <label>Correo
        <input type="email" id="login-correo" autocomplete="username" required>
      </label>
      <label>Contraseña
        <input type="password" id="login-clave" autocomplete="current-password" required>
      </label>
      <button class="btn primario grande" type="submit">Entrar</button>
      <p class="error" id="login-error" hidden></p>
      <button class="btn-texto" type="button" id="btn-olvide">¿Olvidaste tu contraseña?</button>
    </form>
  </div>
</section>

<!-- ===================== APP ===================== -->
<div id="app" hidden>
  <header class="barra">
    <button class="icono" id="btn-menu" aria-label="Cuenta y ajustes">☰</button>
    <div class="titulo">
      <strong id="titulo-vista">Terreno</strong>
      <span id="subtitulo-vista"></span>
    </div>
    <div class="estado">
      <span id="chip-conexion" class="chip">···</span>
      <button class="icono" id="btn-sync" title="Sincronizar" aria-label="Sincronizar">⟳</button>
      <button class="icono btn-alternar-tema" id="btn-tema" title="Elegir tema de colores" aria-label="Elegir tema">
        <svg class="icono-paleta" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"></path></svg>
      </button>
    </div>
  </header>

  <nav id="menu" class="menu" aria-label="Secciones">
    <div class="menu-grupo" data-grupo="terreno" data-corto="Terreno">
      <button class="grupo-cab" type="button" data-vista="terreno"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span class="grupo-nombre">Terreno</span></button>
    </div>
    <div class="menu-grupo" data-grupo="revision" data-corto="Revisión" data-rol="supervisor">
      <button class="grupo-cab" type="button" aria-expanded="false" aria-controls="gi-revision">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg><span class="grupo-nombre">Revisión del mes</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="grupo-items" id="gi-revision"><div class="grupo-int">
        <button data-vista="avisos" data-rol="supervisor">Avisos</button>
      </div></div>
    </div>
    <div class="menu-grupo" data-grupo="informes" data-corto="Informes" data-rol="supervisor">
      <button class="grupo-cab" type="button" aria-expanded="false" aria-controls="gi-informes">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 13h6M9 17h6"/></svg><span class="grupo-nombre">Informes</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="grupo-items" id="gi-informes"><div class="grupo-int">
        <button data-vista="consumos" data-rol="supervisor">Consumos e informes</button>
        <button data-vista="respaldo" data-rol="supervisor">Respaldo</button>
      </div></div>
    </div>
    <div class="menu-grupo" data-grupo="fuerza" data-corto="Casa Fuerza" data-rol="casa_fuerza">
      <button class="grupo-cab" type="button" aria-expanded="false" aria-controls="gi-fuerza">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span class="grupo-nombre">Casa de Fuerza</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="grupo-items" id="gi-fuerza"><div class="grupo-int">
        <button data-vista="cierrecf" data-rol="casa_fuerza">Cierre del mes</button>
        <button data-vista="generadores" data-rol="casa_fuerza">Generadores</button>
        <button data-vista="recargas" data-rol="casa_fuerza">Combustible</button>
      </div></div>
    </div>
    <div class="menu-grupo" data-grupo="config" data-corto="Config." data-rol="supervisor">
      <button class="grupo-cab" type="button" aria-expanded="false" aria-controls="gi-config">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span class="grupo-nombre">Configuración</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="grupo-items" id="gi-config"><div class="grupo-int">
        <button data-vista="equipos" data-rol="supervisor">Equipos</button>
        <button data-vista="puntos" data-rol="supervisor">Puntos de medición</button>
        <button data-vista="grupos" data-rol="supervisor">Grupos</button>
        <button data-vista="etiquetas" data-rol="supervisor">Etiquetas QR</button>
      </div></div>
    </div>
    <div class="menu-grupo" data-grupo="admin" data-corto="Admin" data-rol="admin">
      <button class="grupo-cab" type="button" aria-expanded="false" aria-controls="gi-admin">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span class="grupo-nombre">Administración</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="grupo-items" id="gi-admin"><div class="grupo-int">
        <button data-vista="usuarios" data-rol="admin">Usuarios</button>
        <button data-vista="auditoria" data-rol="admin">Auditoría</button>
        <button data-vista="sugerencias" data-rol="admin">Sugerencias</button>
      </div></div>
    </div>
    <hr>
    <div class="menu-pie">
      <span id="menu-usuario"></span>
      <button data-vista="dispositivo" class="link">Este dispositivo</button>
      <button id="btn-clave" class="link">Cambiar mi contraseña</button>
      <button id="btn-salir" class="link">Cerrar sesión</button>
    </div>
  </nav>
  <div id="velo" class="velo" hidden></div>

  <!-- Panel de la sección tocada en la barra inferior (celular y tablet vertical) -->
  <div id="hoja" class="panel-nav" role="dialog" aria-labelledby="hoja-tit" hidden>
    <div class="panel-nav-cab">
      <strong id="hoja-tit" class="panel-nav-tit"></strong>
      <button class="icono" id="hoja-cerrar" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="panel-nav-lista"></div>
  </div>
  <nav id="navinf" class="navinf" aria-label="Secciones, barra inferior" hidden></nav>

  <div id="banner-cola" class="banner-cola fila" hidden></div>
  <main id="contenido"></main>
</div>

<!-- ===================== MODAL ===================== -->
<div id="modal" class="modal" hidden>
  <div class="modal-caja" role="dialog" aria-modal="true">
    <header><div class="modal-tit"><strong id="modal-titulo"></strong><small id="modal-subtitulo" hidden></small></div>
      <button class="icono" id="modal-cerrar" aria-label="Cerrar">✕</button></header>
    <div id="modal-cuerpo"></div>
  </div>
</div>

<div id="impresion" class="impresion"></div>

<div id="toast" class="toast" hidden></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script src="respaldo.js"></script>
<script src="qr.js"></script>
<script src="app.js"></script>
</body>
</html>
